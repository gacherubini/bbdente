[project]
name = "bddente"
version = "0.1.0"
description = "Prontuario odontologico — substituto do Dentalis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "migracao*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migrations sao geradas pelo autogenerate do Alembic: nao reformatamos a mao,
# senao a proxima geracao briga com o lint.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` em default de argumento e o idioma do FastAPI, nao o bug que o
# B008 procura: a chamada e resolvida uma vez, na montagem da rota.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.Path"]
