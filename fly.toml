app = "bddente"
primary_region = "iad"  # Ashburn, Virginia — escolhido por custo

[build]
  dockerfile = "Dockerfile"

# O Fly roda isto numa maquina temporaria com a imagem NOVA, antes de trocar o
# codigo que atende a clinica — e aborta o deploy se falhar. Rodar o Alembic
# depois, por `fly ssh console`, executaria dentro da imagem antiga: ela nao tem
# o arquivo da migration nova, responde sucesso e nao faz nada, e a tela quebra.
[deploy]
  release_command = "alembic upgrade head"

[env]
  PORT = "8080"
  # A maquina do Fly roda em UTC e a clinica esta em UTC-3. Sem isto,
  # `date.today()` vira o dia seguinte a partir das 21h no Brasil — e o
  # sistema pergunta que dia e hoje em 15 lugares (data do lancamento, mes
  # do financeiro, data de cadastro, emissao do PDF). A imagem ja tem tzdata.
  TZ = "America/Sao_Paulo"

[http_service]
  internal_port = 8080
  force_https = true
  # A maquina fica de pe 24h, e isso e uma MUDANCA: ela dormia quando ninguem
  # estava usando. O relogio dos lembretes (`app/agenda/relogio.py`) bate de 15
  # em 15 minutos para que cada paciente seja avisada na hora dela — maquina
  # dormindo e relogio parado. O Evolution/WhatsApp vai exigir o mesmo, entao o
  # custo (~US$ 3 a 5/mes) e do pacote inteiro, nao so do relogio.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/saude"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
