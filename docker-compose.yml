services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bddente
      POSTGRES_PASSWORD: bddente
      POSTGRES_DB: bddente
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bddente"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
