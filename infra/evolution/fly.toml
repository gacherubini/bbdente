# A Evolution API — o Baileys empacotado — como app SEPARADO no Fly.
#
# Separado de proposito: Baileys e Node, e Node nao entra na imagem que carrega o
# prontuario. O `Dockerfile` do BDDente continua inalterado, `flyctl deploy`
# continua um comando so, e esta aqui sobe uma vez e e atualizada fora de banda.
#
#     fly deploy -c infra/evolution/fly.toml
#
# O passo a passo completo (volume, banco, segredos, QR) esta em
# `docs/OPERACAO.md`, secao "O lembrete de WhatsApp". Este arquivo guarda as
# escolhas; o documento guarda a ordem.

app = "bddente-whatsapp"
primary_region = "iad"  # junto do BDDente e do Postgres: a conversa e pela rede privada

[build]
  # Versao presa a dedo. `latest` aqui e um upgrade de major sem ninguem olhando,
  # numa peca que guarda uma sessao de WhatsApp: uma quebra de schema derruba a
  # conexao e obriga a ler o QR de novo, no dia em que ninguem estava mexendo.
  # As rotas que o `app/agenda/whatsapp/evolution.py` chama sao as da v2
  # (`/message/sendText` com `{number, text}`) — a v1 tem outro formato, entao
  # descer de major quebra o envio.
  # `evoapicloud`, nao `atendai`: o projeto mudou de organizacao no Docker Hub e a
  # antiga foi despublicada. O sintoma de escrever a antiga e um 500 do Fly na
  # criacao do release, que nao fala em imagem nenhuma — dois deploys perdidos
  # ate alguem tentar o `docker pull` a mao e ler "repository does not exist".
  image = "evoapicloud/evolution-api:v2.3.7"

[env]
  SERVER_URL = "http://bddente-whatsapp.internal:8080"
  SERVER_PORT = "8080"
  LANGUAGE = "pt-BR"

  # --- a sessao ------------------------------------------------------------
  # A v2 guarda a instancia no Postgres (Prisma), nao em arquivo. O banco e o
  # `evolution`, criado no cluster que ja existe — e NAO e o banco do BDDente:
  # tabela de prontuario e sessao de WhatsApp nao dividem schema. A URI vai por
  # `fly secrets`, porque carrega senha.
  DATABASE_ENABLED = "true"
  DATABASE_PROVIDER = "postgresql"
  DATABASE_CONNECTION_CLIENT_NAME = "bddente"
  DATABASE_SAVE_DATA_INSTANCE = "true"

  # --- o que NAO se guarda -------------------------------------------------
  # Tudo `false` de proposito, e nao por economia de disco: aqui passa conversa
  # de paciente. Guardar mensagem, contato e historico criaria uma segunda base
  # de dado pessoal — fora do BDDente, fora da auditoria, fora do backup que a
  # clinica sabe que tem. O que precisa ficar registrado ja fica: o texto que
  # saiu esta em `lembrete.texto`, com a allowlist do `agenda/mensagem.py`.
  DATABASE_SAVE_DATA_NEW_MESSAGE = "false"
  DATABASE_SAVE_MESSAGE_UPDATE = "false"
  DATABASE_SAVE_DATA_CONTACTS = "false"
  DATABASE_SAVE_DATA_CHATS = "false"
  DATABASE_SAVE_DATA_LABELS = "false"
  DATABASE_SAVE_DATA_HISTORIC = "false"

  # Ninguem le as respostas (Task 19 cancelada), entao nao ha webhook para onde
  # mandar o que chega. Desligado e a verdade; ligado seria uma promessa falsa.
  WEBHOOK_GLOBAL_ENABLED = "false"

  # Redis seria um terceiro app para manter. Cache local basta para uma clinica.
  CACHE_REDIS_ENABLED = "false"
  CACHE_LOCAL_ENABLED = "true"

  # O nome que aparece em "Aparelhos conectados" no celular dela. E por ele que
  # ela reconhece o que desconectar se um dia quiser desconectar.
  CONFIG_SESSION_PHONE_CLIENT = "BDDente"
  CONFIG_SESSION_PHONE_NAME = "Chrome"

  # Nunca apagar a instancia sozinha por QR nao lido: o BDDente recria quando
  # alguem clica em Conectar, mas apagar sozinha e como a sessao some sem
  # ninguem saber por que.
  DEL_INSTANCE = "false"
  QRCODE_LIMIT = "30"

  # Log curto: o que sai daqui pode conter numero de paciente, e log de terceiro
  # e o lugar mais facil de vazar dado sem perceber.
  LOG_LEVEL = "ERROR"
  LOG_BAILEYS = "error"
  TELEMETRY = "false"

# ESTA APP TEM ENDERECO PUBLICO, e isso e uma DECISAO REVERTIDA — leia antes de
# mexer. Ate 28/08/2026 nao havia `[http_service]` aqui, de proposito: sem porta
# publicada o Fly nao aloca IP e o proxy dele nunca ve a app, e quem falava com
# ela era so o BDDente pela rede privada 6PN (`bddente-whatsapp.internal`).
#
# O dono do projeto pediu o endereco publico para poder abrir o `/manager` dela
# direto, e pediu duas vezes. Fica registrado o que isso troca:
#
#   **A Evolution nao tem login.** Nao ha usuario, nao ha senha, nao ha segundo
#   fator. A unica coisa entre a internet inteira e o WhatsApp pessoal da mae do
#   dono do projeto e a `AUTHENTICATION_API_KEY` num cabecalho. Vazou a chave —
#   num print, num log, num `curl` colado em algum lugar — e quem a tiver le e
#   manda mensagem como ela, e nada aqui percebe.
#
#   Antes, vazar a chave nao bastava: era preciso tambem estar dentro da rede
#   privada. Essa segunda tranca deixou de existir.
#
# Se um dia isso pesar mais que a comodidade, o caminho de volta e curto: apagar
# o bloco `[http_service]`, `fly ips release <cada endereco>` e deploy — e para
# ver o `/manager` sem IP publico, `fly proxy 8080:8080 -a bddente-whatsapp` e
# abrir `http://localhost:8080/manager`, que da exatamente a mesma tela.
#
# (Um `[[services]]` sem `[[services.ports]]`, que seria a forma obvia de
# escrever "privado", o Fly recusa desde 2024 — e foi o que derrubou o primeiro
# deploy com erro 500. Nao tente escrever "privado" assim.)
[http_service]
  internal_port = 8080
  force_https = true
  # OS DOIS SAO OBRIGATORIOS, e nao ajuste de custo. Com o proxy na frente, o
  # Fly passa a contar trafego e a suspender a maquina sozinho — e Baileys vive
  # de um socket aberto: maquina que dorme e sessao que cai, e QR de novo a cada
  # cochilo. Antes deste bloco existir, nao havia proxy para contar nada e a
  # maquina ficava de pe por consequencia; agora ela fica de pe porque estas
  # duas linhas mandam. Custo: ~US$ 3 a 5/mes, da escolha por Baileys.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
[checks]
  [checks.porta]
    type = "tcp"
    port = 8080
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

# O volume guarda o que a v2 nao poe no banco (midia e arquivos de store). A
# sessao em si vive no Postgres — mas o volume fica porque um app com disco
# proprio sobrevive a um deploy sem depender de o banco estar de pe no segundo
# exato em que ele reinicia.
[mounts]
  source = "evolution_dados"
  destination = "/evolution/instances"

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB e o suficiente para uma instancia so. Se o log mostrar OOM depois de
  # algumas semanas de sessao, sobe para 1 GB — e a conta sobe junto.
  memory = "512mb"
